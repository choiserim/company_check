<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기업 컨설팅 브리핑 생성기</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --navy:#1F3A5C; --dark:#0E1F30; --mid:#2C4E70; --gold:#C9820A;
  --text:#1A2430; --gray:#5B6B7A; --muted:#8A97A3; --panel:#F3F7FA;
  --panel2:#F3F6F8; --border:#D8E0E6; --bg:#E9EDF1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;}
button{font-family:inherit}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:56px 1fr;height:100vh}
#topbar{grid-column:1/3;background:var(--dark);color:#fff;display:flex;align-items:center;
  gap:14px;padding:0 18px;box-shadow:0 1px 6px rgba(0,0,0,.25);z-index:20}
#topbar .brand{font-size:14px;font-weight:700;letter-spacing:.2px}
#topbar .brand span{color:var(--gold)}
#topbar .doctitle{font-size:12px;color:#9FB2C4;border-left:1px solid #34506B;padding-left:14px}
#topbar .spacer{flex:1}
.btn{border:1px solid #3C5B79;background:#1B3854;color:#E7EEF5;border-radius:6px;
  padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#26496A}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#231500}
.btn.gold:hover{background:#E09912}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- sidebar ---------- */
#side{background:#122B44;color:#C6D5E2;overflow-y:auto;padding:14px 0 40px}
#side h3{font-size:10.5px;letter-spacing:1.6px;color:#7C97B0;margin:6px 0 8px;padding:0 16px;font-weight:700}
.nav-item{display:flex;gap:9px;align-items:flex-start;padding:8px 16px;cursor:pointer;font-size:12.5px;
  border-left:3px solid transparent;line-height:1.35}

.nav-item:hover{background:#19374F}
.nav-item.active{background:#1D4062;border-left-color:var(--gold);color:#fff}
.nav-item .no{color:var(--gold);font-weight:700;font-size:11.5px;min-width:20px}
.nav-sub{padding:6px 16px 6px 46px;font-size:11.5px;color:#9EB4C8;cursor:pointer;
  border-left:3px solid transparent;line-height:1.3}
.nav-sub:hover{background:#19374F;color:#fff}
.nav-sub.active{background:#1D4062;border-left-color:var(--gold);color:#fff;font-weight:600}
.nav-sub .pg{color:#6F8AA3;font-size:10.5px;margin-left:4px}
.side-sep{height:1px;background:#1E4058;margin:10px 16px}

/* ---------- main ---------- */
#main{overflow-y:auto;padding:22px 26px 80px}
#drop{border:2px dashed #A9BCCD;border-radius:12px;background:#fff;padding:22px;margin:0 auto 24px;
  max-width:1280px;text-align:center;transition:.15s}
#drop.over{border-color:var(--gold);background:#FFF8EC}
#drop h2{margin:0 0 6px;font-size:16px;color:var(--navy)}
#drop p{margin:0 0 14px;font-size:12.5px;color:var(--gray);line-height:1.6}
#drop .types{font-size:11px;color:var(--muted);margin-top:10px}
.filechips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--navy)}
.chip.err{background:#FDECEA;border-color:#F5C6C0;color:#A32F22}
#log{max-width:1280px;margin:0 auto 20px;background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;font-size:12px;color:var(--gray);line-height:1.7;display:none}
#log b{color:var(--navy)}
#log .ok{color:#1E7A46;font-weight:600}
#log .warn{color:#B26A00;font-weight:600}

.slide-wrap{position:relative;margin:0 auto 26px;max-width:1280px}
.slide-label{font-size:11.5px;color:var(--gray);margin:0 0 6px;font-weight:600;display:flex;gap:8px;align-items:center}
.slide-label .badge{background:var(--navy);color:#fff;border-radius:4px;padding:2px 7px;font-size:10.5px}
.slide-box{position:relative;overflow:hidden;background:#fff;box-shadow:0 3px 14px rgba(20,40,60,.14);border-radius:2px}
.slide{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;background:#fff}
.el{position:absolute;white-space:pre-wrap;word-break:break-word}
.el.editable:hover{outline:1px dashed #C9820A;outline-offset:2px;cursor:text}
.el.editable:focus{outline:2px solid #C9820A;outline-offset:2px;background:#FFFBF2}
table.gt{border-collapse:collapse;table-layout:fixed;width:100%}
.el svg{display:block}
table.gt td{border:1px solid var(--border);vertical-align:middle;overflow:hidden}
table.gt td div{padding:2px 6px}
table.gt td.ed:hover{outline:1px dashed #C9820A;outline-offset:-1px;cursor:text}

#empty{max-width:1280px;margin:60px auto;text-align:center;color:var(--gray);font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12283C;color:#fff;
  padding:11px 20px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none}
#busy{position:fixed;inset:0;background:rgba(10,20,32,.55);display:none;align-items:center;justify-content:center;z-index:70}
#busy .card{background:#fff;border-radius:12px;padding:26px 34px;font-size:14px;color:var(--navy);font-weight:600;
  box-shadow:0 10px 40px rgba(0,0,0,.35);text-align:center}
.spin{width:26px;height:26px;border:3px solid #DDE6EE;border-top-color:var(--gold);border-radius:50%;
  margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">기업 컨설팅 브리핑 <span>생성기</span></div>
    <div class="doctitle" id="topDoc">양식 대기중</div>
    <div class="spacer"></div>
    <button class="btn" id="btnUpload">📄 파일 업로드</button>
    <button class="btn ghost" id="btnSave">💾 작업 저장</button>
    <button class="btn ghost" id="btnLoad">📂 작업 불러오기</button>
    <button class="btn ghost" id="btnReset">↺ 초기화</button>
    <button class="btn gold" id="btnPptx">⬇ 전체 문서 다운로드 (PPTX)</button>
  </div>
  <div id="side"></div>
  <div id="main">
    <div id="drop">
      <h2>업로드한 파일 내용이 브리핑 양식에 자동으로 작성됩니다</h2>
      <p>기업신용조사보고서(PDF) · 재무자료(XLS/XLSX) · 텍스트 파일을 이 영역에 끌어놓거나 클릭해서 선택하세요.<br>
         추출된 값은 아래 브리핑 양식 전 페이지에 채워지며, 각 항목은 직접 클릭해 수정할 수 있습니다.</p>
      <button class="btn gold" id="btnPick">파일 선택</button>
      <div class="filechips" id="chips"></div>
      <div class="types">지원 형식 : PDF · XLSX · XLS · CSV · TXT · DOCX · PPTX</div>
    </div>
    <div id="log"></div>
    <div id="slides"></div>
  </div>
</div>
<input type="file" id="fileInput" multiple accept=".pdf,.xlsx,.xls,.csv,.txt,.docx,.pptx" style="display:none">
<input type="file" id="jsonInput" accept=".json" style="display:none">
<div class="toast" id="toast"></div>
<div id="busy"><div class="card"><div class="spin"></div><div id="busyMsg">처리 중…</div></div></div>
<script>
/* ============================================================
   PART A. 공통 유틸
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nz = (v,d) => (v===null||v===undefined||v===''||(typeof v==='number'&&!isFinite(v))) ? d : v;
const D_ = '—';

function toNum(s){
  if(s===null||s===undefined) return null;
  if(typeof s==='number') return isFinite(s)?s:null;
  const raw=String(s).trim();
  const negative=/^\(.*\)$/.test(raw);
  const t=raw.replace(/[,\s]/g,'').replace(/[()]/g,'');
  if(t==='-'||t===''||t==='정보없음') return null;
  const v=parseFloat(t.replace(/[^0-9.\-]/g,''));
  return isFinite(v)?(negative?-Math.abs(v):v):null;
}
function fmt(n,dec){
  if(n===null||n===undefined||!isFinite(n)) return D_;
  const d = dec===undefined?0:dec;
  return Number(n).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pctStr(cur,prev){
  if(cur===null||prev===null||!isFinite(cur)||!isFinite(prev)||prev===0) return D_;
  const r=(cur-prev)/Math.abs(prev)*100;
  return (r>=0?'+':'−')+fmt(Math.abs(r),1)+'%';
}
function pctNum(cur,prev){
  if(cur===null||prev===null||!prev) return null;
  return (cur-prev)/Math.abs(prev)*100;
}
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function yearsBetween(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr); if(isNaN(d)) return null;
  return (Date.now()-d.getTime())/(365.25*24*3600*1000);
}
function getPath(o,p){ return p.split('.').reduce((a,k)=> (a==null?a:a[k]), o); }
function setPath(o,p,v){
  const ks=p.split('.'); let c=o;
  for(let i=0;i<ks.length-1;i++){ if(c[ks[i]]===undefined) c[ks[i]]={}; c=c[ks[i]]; }
  c[ks[ks.length-1]]=v;
}
function toast(msg,ms){ const t=$('#toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', ms||2600); }
function busy(on,msg){ $('#busy').style.display=on?'flex':'none'; if(msg) $('#busyMsg').textContent=msg; }
function logLine(html){ const l=$('#log'); l.style.display='block'; l.insertAdjacentHTML('beforeend', html+'<br>'); }
function logClear(){ const l=$('#log'); l.innerHTML=''; l.style.display='none'; }

/* ============================================================
   PART B. 파일 → 텍스트 추출
   ============================================================ */
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function fileToText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.pdf')) return await pdfToText(file);
  if(name.endsWith('.xlsx')||name.endsWith('.xls')||name.endsWith('.csv')) return await sheetToText(file);
  if(name.endsWith('.docx')) return await ooxmlToText(file,'word/document.xml','w:p');
  if(name.endsWith('.pptx')) return await pptxToText(file);
  return await file.text();
}
async function pdfToText(file){
  const buf=await file.arrayBuffer();
  let pdf;
  try{ pdf=await pdfjsLib.getDocument({data:buf}).promise; }
  catch(e){ // 워커 로드 실패(로컬 파일 직접 실행 등) 시 메인스레드로 재시도
    pdf=await pdfjsLib.getDocument({data:buf, disableWorker:true}).promise;
  }
  let out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    // y좌표 기준으로 행 재구성
    const rows=new Map();
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      let key=null;
      for(const k of rows.keys()){ if(Math.abs(k-y)<=3){key=k;break;} }
      if(key===null){ key=y; rows.set(key,[]); }
      rows.get(key).push({x:it.transform[4], w:it.width||0, h:Math.abs(it.transform[3])||10, s:it.str});
    });
    const ys=[...rows.keys()].sort((a,b)=>b-a);
    ys.forEach(y=>{
      const items=rows.get(y).sort((a,b)=>a.x-b.x);
      let line='', end=null;
      items.forEach(o=>{
        if(!o.s) return;
        if(end!==null && (o.x-end) > o.h*0.25) line+=' ';
        line+=o.s; end=o.x+o.w;
      });
      line=line.replace(/\s+/g,' ').trim();
      if(line) out.push(line);
    });
    out.push('');
  }
  return out.join('\n');
}
async function sheetToText(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',codepage:949});
  let out=[];
  wb.SheetNames.forEach(n=>{
    out.push('### '+n);
    out.push(XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:' ',blankrows:false}));
  });
  return out.join('\n').replace(/,+\s*$/gm,'').replace(/[ \t]+/g,' ');
}
async function ooxmlToText(file,entry,ptag){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const f=zip.file(entry); if(!f) return '';
  const xml=await f.async('string');
  return xmlParas(xml,ptag);
}
async function pptxToText(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b)=>(+a.match(/\d+/)[0])-(+b.match(/\d+/)[0]));
  let out=[];
  for(const n of names){ out.push(xmlParas(await zip.file(n).async('string'),'a:p')); }
  return out.join('\n');
}
function xmlParas(xml,ptag){
  const re=new RegExp('<'+ptag+'[ >][\\s\\S]*?</'+ptag+'>','g');
  const paras=xml.match(re)||[];
  return paras.map(p=>{
    const ts=p.match(/<(?:w|a):t[^>]*>([\s\S]*?)<\/(?:w|a):t>/g)||[];
    return ts.map(t=>t.replace(/<[^>]+>/g,'')).join('')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
  }).filter(Boolean).join('\n');
}
/* ============================================================
   PART C. 텍스트 → 데이터 추출 (기업신용조사보고서 등)
   ============================================================ */
function extractData(text){
  const T=String(text||'').replace(/\r/g,'');
  const L=T.split('\n').map(s=>s.replace(/[ \t]+/g,' ').trim());
  const flat=L.join('\n');
  const P={found:[]};
  const mark=k=>{ if(P.found.indexOf(k)<0) P.found.push(k); };
  const g=(re,i)=>{ const m=flat.match(re); return m&&m[i||1]?String(m[i||1]).trim():null; };
  const block=(a,b)=>{ const i=flat.search(a); if(i<0) return '';
    const rest=flat.slice(i); const j=b?rest.search(b):-1; return j>0?rest.slice(0,j):rest; };
  const linesOf=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const isNum=t=>/^-?[\d,]+(\.\d+)?$/.test(t);

  /* ---- 기업개요 ---- */
  P.name    = g(/^기업명\s+(\S+)/m) || g(/기업명\s*[:：]\s*(\S+)/);
  P.nameEn  = g(/영문기업명\s+([A-Za-z0-9 .,()&-]+)/);
  P.bizNo   = g(/사업자번호\s*[:：]?\s*(\d{3}-\d{2}-\d{5})/);
  P.corpNo  = g(/법인\(?주민\)?번호\s*[:：]?\s*(\d{6}-\d{7})/);
  P.ceo     = g(/대표자명?\s*[:：]?\s*([가-힣]{2,6}|[A-Za-z]{2,20})/);
  P.employees = toNum(g(/종업원수\s*([\d,]+)\s*명/));
  P.foundDate = g(/설립년월\s*(\d{4}-\d{2}-\d{2})/) || g(/설립일\s*[:：]?\s*(\d{4}-\d{2}-\d{2})/);
  P.corpType  = g(/기업유형\s*(\S+)/);
  P.scale     = g(/기업규모\s*(\S+)/);
  P.settleMonth = g(/결산월\s*(\d{1,2}\s*월)/);
  P.addr      = g(/^주소\s+(\(?\d{0,5}\)?\s?[^\n]+)/m);
  P.industry  = g(/표준산업분류\(1[01]차\)\s*(\([A-Z]\d+\)[^\n]+)/);
  P.product   = g(/주요제품\(?상품\)?\s*([^\n]+?)(?:\s+무역업허가번호|$)/m);
  P.tel       = g(/전화번호\s*([\d-]{7,15})/);
  P.homepage  = g(/홈페이지\s*(\S+)/);
  P.mainBank  = g(/주채권기관\s*(\S+)/);
  P.queryDate = g(/조회일시\s*[:：]?\s*(\d{4}-\d{2}-\d{2})/);
  P.queryTime = g(/조회일시\s*[:：]?\s*\d{4}-\d{2}-\d{2}\s?(\d{2}:\d{2})/);
  if(P.name) mark('기업개요');

  /* ---- 신용정보 ---- */
  P.grade      = g(/기업신용등급[ ]+([A-Za-z0-9+-]{1,6})[ ]*등급/);
  if(P.grade) P.grade = P.grade + ' 등급';
  P.gradeDate  = g(/평가일자\s*[:：]\s*(\d{4}-\d{2}-\d{2})/);
  P.settleDate = g(/결산일자\s*[:：]\s*(\d{4}-\d{2}-\d{2})/);
  const cb=block(/신용정보/, /MY\s?재무|요약재무|^재무상태표$/m);
  if(cb){
    const dates=(cb.match(/\d{4}-\d{2}-\d{2}/g)||[]);
    let vs=(cb.match(/부가가치세\s?(\S*과세자)/)||[])[1];
    P.vatStatus = vs ? ('부가세 '+vs) : null;
    P.regStatus = /법인등기정보[\s\S]{0,200}?정상/.test(cb) ? '정상' : '확인필요';
    P.vatDate = dates[0]||null; P.regDate = dates[1]||null; P.cardDate = dates[2]||null;
    P.cardCnt = (cb.match(/(\d+)\s*건/)||[])[1];
    P.cleanCredit = (cb.match(/해당사항\s?없음/g)||[]).length >= 4;
    mark('신용정보');
  }

  /* ---- 재무 수치 ---- */
  const rowNums=(label,src)=>{
    const s=src||flat;
    const compactLabel=label.replace(/\\\(([^)]+)\\\)/g,'($1)').replace(/\\([()])/g,'$1').replace(/[ ]/g,'');
    for(const rawLine of s.split('\n')){
      const line=rawLine.replace(/[\u00a0\t]+/g,' ').replace(/[ ]+/g,' ').trim();
      const compact=line.replace(/[ ]/g,'');
      const at=compact.indexOf(compactLabel);
      if(at<0) continue;
      const originalIndex=compactIndex=>{
        let seen=0;
        for(let i=0;i<line.length;i++){
          if(line[i]===' ') continue;
          if(seen===compactIndex) return i;
          seen++;
        }
        return line.length;
      };
      const labelEnd=at+compactLabel.length;
      const after=line.slice(originalIndex(labelEnd));
      if(after.trim() && /[가-힣A-Za-z]/.test(after.trim()[0])) continue;
      const values=(after.match(/-?\(?[\d,]+(?:[.]\d+)?\)?|-/g)||[]);
      if(values.length<1 || values.length>5) continue;
      return values.map(v=>v==='-'?0:toNum(v));
    }
    return null;
  };
  const last3=a=>{ if(!a) return null; return a.length>=3?a.slice(a.length-3):(a.length===2?[null].concat(a):[null,null,a[0]]); };
  const k2m=a=>a?a.map(v=>v===null?null:Math.round(v/1000)):null;

  // 상세 재무제표(단위:천원) 구간을 우선 사용 — 요약표(백만원)와 혼동 방지
  const unitBlock=(name,unit,endRe)=>{
    const heading=name.replace(/[ ]/g,'\\s*');
    const unitRe=unit.replace(/[ ]/g,'\\s*');
    const re=new RegExp('^'+heading+'[^\n]*(?:\n[^\n]*){0,4}?(?:단위\\s*[:：]?\\s*)?'+unitRe,'m');
    const m=flat.match(re); if(!m) return '';
    const rest=flat.slice(m.index);
    const j=endRe? rest.search(endRe) : -1;
    return j>0? rest.slice(0,j) : rest;
  };
  const bsDet=unitBlock('재무상태표','천원',/^손익계산서/m);
  const plDet=unitBlock('손익계산서','천원',/^현금흐름표/m);
  const cmDet=unitBlock('제조원가명세서','천원',/^재무비율/m);
  const bsSrc=bsDet||flat, plSrc=plDet||flat, cmSrc=cmDet||flat;
  const bsScale=!!bsDet, plScale=!!plDet, cmScale=!!cmDet;
  const financialRow=(label,src,scale)=>{
    const values=last3(rowNums(label,src));
    return scale ? k2m(values) : values;
  };

  const F={};
  F.assets      = financialRow('자산',bsSrc,bsScale);
  F.curAssets   = financialRow('유동자산',bsSrc,bsScale);
  F.nonCurAssets= financialRow('비유동자산',bsSrc,bsScale);
  F.liab        = financialRow('부채',bsSrc,bsScale);
  F.curLiab     = financialRow('유동부채',bsSrc,bsScale);
  F.nonCurLiab  = financialRow('비유동부채',bsSrc,bsScale);
  F.ltDebt      = financialRow('장기차입금',bsSrc,bsScale);
  F.equity      = financialRow('자본',bsSrc,bsScale);
  F.capital     = financialRow('자본금',bsSrc,bsScale);
  F.retained    = financialRow('이익잉여금',bsSrc,bsScale);

  F.revenue   = financialRow('매출액',plSrc,plScale);
  F.cogs      = financialRow('매출원가',plSrc,plScale);
  F.gross     = financialRow('매출총이익\\(손실\\)',plSrc,plScale) || financialRow('매출총이익',plSrc,plScale);
  F.sga       = financialRow('판매비와관리비',plSrc,plScale);
  F.op        = financialRow('영업이익\\(손실\\)',plSrc,plScale) || financialRow('영업이익',plSrc,plScale);
  F.nonOpInc  = financialRow('영업외수익',plSrc,plScale);
  F.nonOpExp  = financialRow('영업외비용',plSrc,plScale);
  F.pretax    = financialRow('법인세비용차감전순손익',plSrc,plScale) || financialRow('법인세차감전순이익',plSrc,plScale);
  F.net       = financialRow('당기순이익\\(순손실\\)',plSrc,plScale) || financialRow('당기순이익',plSrc,plScale);
  F.interest  = financialRow('이자비용',plSrc,plScale);
  F.disposal  = financialRow('유형,리스자산처분이익',plSrc,plScale);
  const k2m2=a=>a?a.map(v=>v===null?null:Math.round(v/10)/100):null;   // 천원 → 백만원(소수 2자리)
  F.deprec    = financialRow('감가상각비',cmSrc,cmScale);
  F.severance = cmScale ? k2m2(last3(rowNums('퇴직급여',cmSrc))) : last3(rowNums('퇴직급여',cmSrc));
  F.insurance = plScale ? k2m2(last3(rowNums('보험료',plSrc))) : last3(rowNums('보험료',plSrc));
  // 특수관계자 대여금(가지급금 성격) · 투자자산
  F.ltLoan    = bsScale ? k2m2(last3(rowNums('장기대여금',bsSrc))) : last3(rowNums('장기대여금',bsSrc));
  F.stLoan    = bsScale ? k2m2(last3(rowNums('단기대여금',bsSrc))) : last3(rowNums('단기대여금',bsSrc));
  F.investAst = financialRow('투자자산',bsSrc,bsScale);
  F.deposit   = financialRow('보증금등',bsSrc,bsScale);
  // 제조원가 구성 · 연구개발 성격 지출
  F.material  = financialRow('원재료비',cmSrc,cmScale);
  F.laborCost = financialRow('노동관계비용',cmSrc,cmScale);
  F.overhead  = financialRow('경비',cmSrc,cmScale);
  F.outsource = financialRow('외주가공비',cmSrc,cmScale);
  F.rnd       = cmScale ? k2m2(last3(rowNums('경상개발비',cmSrc))) : last3(rowNums('경상개발비',cmSrc));
  F.mfgCost   = financialRow('당기제품제조원가',cmSrc,cmScale);
  // 이익잉여금처분계산서 (배당 여부 확인)
  const rsDet = unitBlock('이익잉여금처분계산서','천원',/^제조원가명세서|^재무비율/m);
  const rsSrc=rsDet||flat, rsScale=!!rsDet;
  F.unappropriated = rsScale ? k2m(last3(rowNums('미처분이익잉여금\\(결손금\\)',rsSrc))) : last3(rowNums('미처분이익잉여금\\(결손금\\)',rsSrc));
  F.priorAdj       = rsScale ? k2m2(last3(rowNums('\\(전기오류수정손실\\)',rsSrc))) : last3(rowNums('\\(전기오류수정손실\\)',rsSrc));
  // 요약현금흐름분석
  const cfB = block(/(?:요약\s*)?현금흐름\s*분석/, /(?:요약\s*)?재무비율|^연혁/m) || flat;
  const cfRow=(label)=>{
    const m=cfB.match(new RegExp(label+'[^0-9\\-]{0,14}(-?[0-9,]+)[ ]+(-?[0-9,]+)[ ]+(-?[0-9,]+)'));
    return m? [toNum(m[1]),toNum(m[2]),toNum(m[3])] : null;
  };
  F.cashOp  = cfRow('현금영업이익');
  F.cashOrd = cfRow('경상활동후');
  F.cashInv = cfRow('투자활동후');
  const cg = cfB.match(/현금흐름등급[ ]+(\S+)[ ]+(\S+)[ ]+(\S+)/);
  P.cfGrade = cg? [cg[1],cg[2],cg[3]] : null;
  if(F.cashOp) mark('현금흐름');
  if(F.material) mark('제조원가');
  if(F.unappropriated) mark('이익잉여금·배당');
  if(F.ltLoan) mark('특수관계자 대여금');

  const sumBS=block(/요약재무상태표/, /요약손익계산서|요약현금/);
  const sumPL=block(/요약손익계산서/, /요약현금|요약재무비율/);
  if(!F.assets)  F.assets  = last3(rowNums('자산총계',sumBS));
  if(!F.liab)    F.liab    = last3(rowNums('부채총계',sumBS));
  if(!F.equity)  F.equity  = last3(rowNums('자본총계',sumBS));
  if(!F.capital) F.capital = last3(rowNums('자본금',sumBS));
  if(!F.revenue) F.revenue = last3(rowNums('매출액',sumPL));
  if(!F.op)      F.op      = last3(rowNums('영업이익',sumPL));
  if(!F.net)     F.net     = last3(rowNums('당기순이익',sumPL));
  if(F.revenue) mark('재무제표');
  P.fin=F;

  /* ---- 연도 라벨 ---- */
  const yrHead=flat.match(/구분\s+(\d{4})(?:-\d{2}-\d{2})?\s+(\d{4})(?:-\d{2}-\d{2})?\s+(\d{4})/);
  P.years = yrHead? [yrHead[1],yrHead[2],yrHead[3]] : null;
  if(!P.years && P.settleDate){ const y=+P.settleDate.slice(0,4); P.years=[String(y-2),String(y-1),String(y)]; }

  /* ---- 재무비율 ---- */
  const rb=unitBlock('재무비율','%',/^재무진단/m) || block(/요약재무비율/, /^연혁$|^사업목적$/m) || flat;
  const R={};
  const rr=(label,src)=>{ let a=rowNums(label,src||rb); if(!a) a=rowNums(label,flat); return a?last3(a):null; };
  R.revGrowth  = rr('매출액증가율');
  R.opGrowth   = rr('영업이익증가율');
  R.netGrowth  = rr('순이익증가율');
  R.opMargin   = rr('영업이익률');
  R.roe        = rr('ROE');
  R.netMargin  = rr('당기순이익율') || rr('당기순이익률');
  R.ebitda     = rr('EBITDA마진율');
  R.debtRatio  = rr('부채비율');
  R.borrowDep  = rr('차입금의존도');
  R.interestCov= rr('이자보상배수\\(배\\)');
  R.currentRatio=rr('유동비율');
  R.arTurn     = rr('매출채권회전율\\(회\\)');
  R.capTurn    = rr('총자본회전율\\(회\\)');
  R.roa        = rr('총자산순이익률\\(ROA\\)');
  R.equityRatio= rr('자기자본비율');
  R.grossMargin= rr('매출총이익률');
  R.cogsRatio  = rr('매출원가율');
  R.sgaRatio   = rr('판관비율');
  R.payout     = rr('배당성향');
  R.divRate    = rr('배당율') || rr('배당률');
  R.retention  = rr('사내유보율');
  R.rndSales   = rr('연구개발비대매출액');
  R.avgIntRate = rr('차입금평균이자율');
  R.quickRatio = rr('당좌비율');
  R.valueAdded = rr('부가가치율');
  R.eqTurn     = rr('자기자본회전율\\(회\\)');
  R.fixedLTFit = rr('고정장기적합율') || rr('고정장기적합률');
  R.loanToAsset= rr('장단기대여금/총자산');
  if(R.revGrowth||R.debtRatio) mark('재무비율');
  P.ratio=R;

  /* ---- 업종평균 ---- */
  const dgIdx=flat.search(/^재무진단/m);
  const dgAll=dgIdx>=0? flat.slice(dgIdx) : '';
  const A={};
  const avgOf=(label)=>{
    const re=new RegExp('^'+label+'[ ]+([0-9,.]+)[ ]*[▲▼△▽-]*[ ]*(?:증가|감소|유지)?[ ]+([0-9,.]+)','m');
    const m=dgAll.match(re); return m?toNum(m[1]):null;
  };
  A.revGrowth=avgOf('매출액증가율'); A.opGrowth=avgOf('영업이익증가율');
  A.opMargin=avgOf('영업이익률');     A.ebitda=avgOf('EBITDA마진율');
  A.debtRatio=avgOf('부채비율');      A.borrowDep=avgOf('차입금의존도');
  A.currentRatio=avgOf('유동비율');   A.interestCov=avgOf('이자보상배수\\(배\\)');
  A.arTurn=avgOf('매출채권회전율\\(회\\)'); A.capTurn=avgOf('총자본회전율\\(회\\)');
  // 지표명이 표 안에서 줄바꿈된 경우(예: "영업이익증가 / 율") 라벨 매칭이 실패하므로,
  // 숫자만 있는 행의 뒤 3개 값(조회기업 3개년)과 이미 확보한 비율 배열을 대조해 업종평균을 채운다.
  const near=(x,y)=>{ if(x===null||y===null||x===undefined||y===undefined) return false;
    return Math.abs(x-y) <= Math.max(0.06, Math.abs(y)*0.02); };
  const same=(a,b)=>a&&b&&a.length===3&&b.length===3&&a.every((v,i)=>near(v,b[i]));
  linesOf(dgAll).forEach(ln=>{
    if(/[가-힣]{2,}/.test(ln.replace(/증가|감소|유지/g,''))) return;   // 라벨이 섞인 줄 제외
    const nums=(ln.match(/-?[\d,]+(?:\.\d+)?/g)||[]).map(toNum);
    if(nums.length<4) return;
    const tail=nums.slice(-3), avg=nums[0];
    Object.keys(R).forEach(k=>{
      if(same(tail,R[k]) && (A[k]===null||A[k]===undefined)) A[k]=avg;
    });
  });
  P.indAvg=A;

  /* ---- 재무진단 의견 ---- */
  const dg=block(/^재무진단$/m, /^성장성$/m);
  P.diag={};
  ['성장성','수익성','재무구조','부채상환능력','활동성'].forEach(k=>{
    const m=dg.match(new RegExp('(?:^|\\n)'+k+'\\s*\\n?([^\\n]{10,200})'));
    if(m) P.diag[k]=m[1].trim();
  });
  P.diagAllGood = /양호/.test(dg) && !/미흡|불량|취약/.test(dg);

  /* ---- 주요주주 ---- */
  const sb=block(/주요주주\s*현황/, /관계회사\s*현황|^사업장\s*현황$/m);
  P.shareholders=[];
  const addShareholder=(name,ratio,rel,kind,co,raw)=>{
    if(!name||ratio===null||ratio===undefined||ratio<0||ratio>100) return;
    if(P.shareholders.some(s=>s.name===name)) return;
    P.shareholders.push({name,ratio,rel:rel||'',kind:kind||'',co:co||'',raw:raw||''});
  };
  linesOf(sb).forEach(ln=>{
    if(/^(주주명|기준일자|소유주식수|보통주|구분|단위)/.test(ln)) return;
    const tk=ln.split(' ');
    const nums=tk.filter(isNum);
    const numericValues=(ln.match(/-?\d+(?:\.\d+)?/g)||[]).map(toNum).filter(v=>v!==null);
    const percent=ln.match(/([\d.]+)\s*%/);
    const relation=tk.find(t=>/^(본인|가족|타인|계열|기타)$/.test(t))||'';
    const nameParts=[];
    for(const token of tk){
      if(isNum(token)||/%$/.test(token)||/^(본인|가족|타인|계열|기타|대표이사|임원|등기|비등기)$/.test(token)) break;
      nameParts.push(token);
    }
    const nameToken=tk.find(t=>/^[가-힣]{2,6}$/.test(t)&&!/^(본인|가족|타인|계열|기타)$/.test(t));
    const name=nameToken||nameParts.join(' ').trim();
    let ratio=percent?toNum(percent[1]):null;
    if(ratio===null){
      const candidates=(numericValues.length?numericValues:nums.map(toNum))
        .filter(v=>v!==null&&v>=0&&v<=100);
      ratio=candidates.length?candidates[candidates.length-1]:null;
    }
    addShareholder(name,ratio,relation,nameParts[1]&&!isNum(nameParts[1])&&!/[0-9%"]/.test(nameParts[1])?nameParts[1]:'',
      /(대표이사|임원|타인|사원)$/.test(tk[tk.length-1])?tk[tk.length-1]:'',ln);
  });
  if(!P.shareholders.length){
    const sb2=block(/주요주주/, /관계회사\s*현황|요약재무/);
    linesOf(sb2).forEach(ln=>{
      const m=ln.match(/^([가-힣A-Za-z().]{2,20})\s+([\d.]+)\s*%/);
      if(m) addShareholder(m[1],+m[2],'','','',ln);
    });
  }
  const shareSummary=block(/["']주요\s+주주["']/, /요약\s*재무상태표/);
  const summaryShares=[];
  linesOf(shareSummary).forEach(ln=>{
    const matches=[...ln.matchAll(/([가-힣A-Za-z()]{2,20})\s+([\d]+(?:\.\d+)?)\s*%/g)];
    matches.forEach(m=>summaryShares.push({name:m[1],ratio:toNum(m[2])}));
  });
  const prior=P.shareholders;
  const matchedSummaryShares=summaryShares.filter(s=>prior.some(item=>item.name===s.name));
  if(matchedSummaryShares.length){
    const summaryByName=new Map(matchedSummaryShares.map(s=>[s.name,s.ratio]));
    P.shareholders=prior.map(old=>Object.assign({},old,
      summaryByName.has(old.name)?{ratio:summaryByName.get(old.name)}:{}));
  }
  if(P.shareholders.length) mark('주요주주');

  /* ---- 경영진 ---- */
  const eb=block(/경영진\s*현황/, /COPYRIGHT|주요주주\s*현황|^사업장\s*현황$/m);
  P.execs=[];
  const addExec=(name,title,line)=>{
    if(!name||!title||P.execs.some(e=>e.name===name&&e.title===title)) return;
    P.execs.push({name,title,raw:line,
      reg:/비등기/.test(line)?'비등기':(/등기/.test(line)?'등기':''),
      rel:(line.split(' ').find(t=>/^(본인|가족|타인|기타)$/.test(t))||''),
      note:/비상근/.test(line)?'비상근':''});
  };
  const execRole=/^(공동대표이사및사원|공동대표이사|대표이사|사내이사|사외이사|감사|전무|상무|부사장|사장|회장)$/;
  linesOf(eb).forEach(ln=>{
    if(/^(구분|기준일자|주식소유현황|경영실권자|성명)/.test(ln)) return;
    const tk=ln.split(' ');
    const titleIndex=tk.findIndex(t=>execRole.test(t));
    const title=titleIndex>=0
      ? (tk[titleIndex]==='공동대표이사'&&tk[titleIndex+1]==='및사원'?'공동대표이사및사원':tk[titleIndex])
      : null;
    const nameIdx=tk.findIndex(t=>/^[가-힣]{2,4}$/.test(t)
      && !/^(등기|비등기|본인|가족|타인|기타|비상근|상근|이사|감사|사장|회장|사원|및사원|공동대표이사|공동대표이사및사원|사내이사|사외이사|대표이사)$/.test(t));
    if(title && nameIdx>=0){
      addExec(tk[nameIdx],title,ln);
    }
    const fallback=ln.match(/(?:^|\s)(공동대표이사및사원|공동대표이사|대표이사|사내이사|사외이사|감사|전무|상무|부사장|사장|회장)\s*([가-힣]{2,4})(?=\s|$)/);
    if(fallback && !/^(등기|비등기|상근|비상근|및사원)$/.test(fallback[2])) addExec(fallback[2],fallback[1],ln);
  });
  const execLines=linesOf(eb);
  const execTitles=/^(대표이사|사내이사|사외이사|감사|전무|상무|부사장|사장|회장)$/;
  execLines.forEach((ln,i)=>{
    const current=ln.trim(), next=(execLines[i+1]||'').trim();
    if(execTitles.test(current) && /^[가-힣]{2,4}$/.test(next)) addExec(next,current,current+' '+next);
    if(/^[가-힣]{2,4}$/.test(current) && execTitles.test(next)) addExec(current,next,current+' '+next);
  });
  if(P.execs.length) mark('경영진');

  /* ---- 거래처 ---- */
  const parseTrade=(bk)=>{
    const arr=[]; const ls=linesOf(bk); const used={};
    const frag=l=>!!l && /^[가-힣A-Za-z().·]{1,16}$/.test(l) && !/\d/.test(l);
    ls.forEach((ln,i)=>{
      if(used[i]) return;
      if(/^(기업명|기준일자|단위|구매처현황|판매처현황|매출구성|사업부문|주요제품)/.test(ln)) return;
      let m=ln.match(/^(.+?)\s+\d{3}-\d{2}-\d{5}\s+\S+\s+([\d.]+)/);
      if(m){ arr.push({name:m[1].replace(/\s+/g,''), share:toNum(m[2])}); return; }
      m=ln.match(/^(.+?)\s+\d{3}-\d{2}-\d{5}\s+([\d.]+)\s*$/);
      if(m){ arr.push({name:m[1].replace(/\s+/g,''), share:toNum(m[2])}); return; }
      // 상호가 셀 안에서 줄바꿈된 경우 : 앞줄 조각 + (사업자번호로 시작하는 행) + 뒷줄 조각
      m=ln.match(/^\d{3}-\d{2}-\d{5}\s+\S+\s+([\d.]+)/);
      if(m){
        const a=frag(ls[i-1])?ls[i-1]:'', b=frag(ls[i+1])?ls[i+1]:'';
        if(b) used[i+1]=1;
        arr.push({name:(a+b).replace(/\s+/g,'')||'확인필요', share:toNum(m[1])}); return;
      }
      m=ln.match(/^([가-힣A-Za-z().·\s]{1,30}?)\s+([\d.]+)\s*$/);
      if(m && toNum(m[2])!==null && toNum(m[2])<=100)
        arr.push({name:m[1].trim().replace(/\s+/g,''), share:toNum(m[2])});
    });
    return arr;
  };
  P.buyers  = parseTrade(block(/구매처현황/, /판매처현황/));
  P.sellers = parseTrade(block(/판매처현황/, /매출구성|^업계순위$/m));
  if(P.buyers.length||P.sellers.length) mark('거래처');

  /* ---- 사업장 ---- */
  const pb=block(/사업장\s*세부\s*현황/, /거래처\s*현황|^업계순위/m) || block(/사업장\s*현황/, /거래처\s*현황/);
  if(pb){
    const area=(k)=>{ const m=pb.match(new RegExp(k+'\\s*([\\d,]+)\\s*㎡\\s*(\\([\\d,]+평\\))?')); return m? (m[1]+'㎡'+(m[2]||'')) : null; };
    P.site={
      owned: (pb.match(/자가소유\s*여부\s*(\S+)/)||[])[1],
      operating: (pb.match(/실제가동\s*여부\s*(\S+)/)||[])[1],
      land: area('대지'),
      building: area('건물'),
      zone: (pb.match(/입지조건\s*(\S+)/)||[])[1],
      complex: (pb.match(/산업단지명\s*(\S+)/)||[])[1],
      collateral: (pb.match(/담보제공여부\s*(\S+)/)||[])[1],
      addr: (pb.match(/주소\s*(\(?\d{0,5}\)?\s?[^\n]+)/)||[])[1]
    };
    mark('사업장');
  }

  /* ---- 인증 · 산업재산권 ---- */
  const certLine=L.findIndex(l=>/벤처/.test(l)&&/이노비즈/.test(l)&&/메인비즈/.test(l));
  P.certs={};
  if(certLine>=0){
    const keys=L[certLine].split(' ').filter(Boolean);
    const vals=(L[certLine+1]||'').split(' ').filter(Boolean);
    keys.forEach((k,i)=>{ if(vals[i]) P.certs[k]=vals[i]; });
    mark('기업인증');
  }
  const ipLine=L.findIndex(l=>/특허/.test(l)&&/실용신안/.test(l)&&/상표권/.test(l));
  P.ip={};
  if(ipLine>=0){
    const keys=L[ipLine].split(' ').filter(k=>/특허|실용신안|디자인|상표권/.test(k));
    const cnts=(L[ipLine+1]||'').match(/\d+\s*건/g)||[];
    keys.forEach((k,i)=>{ if(cnts[i]) P.ip[k]=cnts[i].replace(/\s/g,''); });
    mark('산업재산권');
  }

  /* ---- 업계순위 ---- */
  if(P.name){
    const nm=P.name.replace(/\s/g,'');
    const rl=L.find(l=>l.replace(/\s/g,'').indexOf(nm)>=0 && /^\d+위/.test(l));
    if(rl){
      const m=rl.match(/^(\d+위)\s+.*?([\d,]{4,})\s+\d{1,2}월/);
      P.rank={rank:(m?m[1]:(rl.match(/^(\d+위)/)||[])[1]), revenue:m?toNum(m[2]):null};
      mark('업계순위');
    }
  }
  // 인접 순위 기업 목록
  P.rankList=[];
  linesOf(block(/^업계순위/m, /동종업계내|동종업계\s*내|COPYRIGHT/)).forEach(ln=>{
    const m=ln.match(/^(\d+)위\s+(.+?)\s+([\d,]{3,})\s+\d{1,2}월/);
    if(m) P.rankList.push({rank:+m[1], name:m[2].replace(/\s+/g,''), revenue:toNum(m[3])});
  });

  /* ---- 연혁 ---- */
  const hb=block(/^연혁$/m, /^사업목적|^인적사항|^주요주주/m);
  P.history=[];
  if(hb){
    let pend=[];
    linesOf(hb).forEach(ln=>{
      if(/^(연혁|연혁일자|내용|COPYRIGHT|조회일시)/.test(ln) || ln.length<=2) return;
      const m=ln.match(/^(\d{4}[-./]\d{1,2}[-./]\d{1,2})\s*(.*)$/);
      if(m){ P.history.push({date:m[1].replace(/[./]/g,'-'), text:(pend.join(' ')+' '+(m[2]||'')).trim()}); pend=[]; }
      else if(P.history.length && pend.length===0) P.history[P.history.length-1].text += ' '+ln;
      else pend.push(ln);
    });
    P.history=P.history.filter(h=>h.text).map(h=>({date:h.date, text:h.text.replace(/\s+/g,' ').trim()}));
    if(P.history.length) mark('연혁');
  }

  /* ---- 사업목적 ---- */
  const pu=block(/^사업목적/m, /종합의견|^인적사항|COPYRIGHT/);
  P.purpose=[];
  linesOf(pu).forEach(ln=>{
    const clean=ln.replace(/^["']+|["']+$/g,'').trim();
    const m=clean.match(/^(?:\d+\s*[.)]|[-•])\s*(.+?)\.?$/);
    if(m && m[1].length>1 && !/^\d/.test(m[1])) P.purpose.push(m[1].replace(/\s+/g,' ').trim());
  });
  if(P.purpose.length) mark('사업목적');

  /* ---- 종합의견 · 대표자 이력 ---- */
  P.ceoBirth   = (flat.match(/대표이사\s*\S{2,6}\s*\(\s*(\d{4})\s*년생/)||[])[1];
  P.ceoGender  = (flat.match(/\d{4}\s*년생\s*,\s*([남여])/)||[])[1];
  P.ceoTenure  = (flat.match(/대표자로서\s*종사기간은\s*([0-9]+\s*년\s*[0-9]*\s*개?월?)/)||[])[1];
  P.indTenure  = (flat.match(/동업계\s*종사기간은\s*([0-9]+\s*년\s*[0-9]*\s*개?월?)/)||[])[1];
  P.ceoSchool  = (flat.match(/출신학교\s*\[?[^\]]*\]?\s*(\S+?)\s*\(\d{6}\)/)||[])[1]
              || (flat.match(/(\S*(?:대학교|전문대학|대학))\s*[^\n]{0,12}졸업/)||[])[1];
  P.careers=[];
  linesOf(block(/주요경력사항/, /경영진현황|주요주주현황/)).forEach(ln=>{
    if(/^(기간|근무기업|주요경력)/.test(ln)) return;
    const m=ln.match(/^(\d{4}-\d{2})\s*~\s*(\d{4}-\d{2})?\s+(\S+)\s+(.+?)\s+(\S+)\s+(\S+)\s*$/);
    if(m) P.careers.push({from:m[1], to:m[2]||'현재', corp:m[3], role:m[5], duty:m[6]});
  });
  P.ceoCareer = P.careers.length? P.careers[P.careers.length-1] : null;
  P.auditType  = (flat.match(/설립된\s*(비외감|외감)법인/)||[])[1];
  const rq=flat.match(/(\d{4})년\s*(\d{1,2})\s*~\s*(\d{1,2})월\s*매출액\s*([\d,]+)\s*백만원/);
  P.recentSales= rq? {year:rq[1], from:rq[2], to:rq[3], amount:toNum(rq[4])} : null;
  if(P.ceoTenure||P.recentSales) mark('종합의견');

  /* ---- 관계회사 ---- */
  const af=block(/관계회사현황/, /^사업장현황|사업장\s*현황/m);
  P.affiliates=[];
  P.noAffiliate=/해당사항\s?없음/.test(af);
  linesOf(af).forEach(ln=>{
    const m=ln.match(/^(.+?)\s+(\S+)\s+(\S+)\s+([\d.]+)\s+(\d{4})\s+([\d,]+)\s+([\d,]+)/);
    if(m && !/해당사항|기업명|기준일자|단위/.test(ln)) P.affiliates.push({name:m[1], share:toNum(m[4])});
  });

  /* ---- 매출구성 ---- */
  const mx=block(/매출구성/, /^업계순위|COPYRIGHT/m);
  P.salesMix=[];
  linesOf(mx).forEach(ln=>{
    const m=ln.match(/^(\S+)\s+(.+?)\s+([\d.]+)\s*$/);
    if(m && !/사업부문|기준일자|단위|매출구성/.test(ln)) P.salesMix.push({div:m[1], item:m[2].trim(), share:toNum(m[3])});
  });

  /* ---- 동종업계 경영규모 비교 ---- */
  const pc=block(/동종업계\s*내?\s*경영규모\s*비교/, /COPYRIGHT|^재무상태표/m);
  P.peer=null;
  if(pc){
    const row=(label)=>{
      const m=pc.match(new RegExp('^'+label+'[ ]+((?:-?[0-9,]+[ ]+){5}-?[0-9,]+)','m'));
      return m? m[1].trim().split(/\s+/).map(toNum) : null;
    };
    const q=row('조회기업'), t=row('상위25%'), a=row('평균'), b=row('하위25%');
    if(q) { P.peer={target:q, top:t, avg:a, low:b}; mark('업계비교'); }
  }

  /* ---- 사업장 목록 ---- */
  P.sites=[];
  linesOf(block(/사업장\s*현황/, /사업장\s*세부\s*현황|거래처\s*현황/)).forEach(ln=>{
    const m=ln.match(/^(\d+)\s+(본사|본점|지점|공장|사업장|영업소|기타)\s+(\d{3}-\d{2}-\d{5})\s+(\S+)\s+(.+)$/);
    if(m) P.sites.push({no:+m[1], kind:m[2], name:m[4],
      desc:m[5].replace(/[\d-]{9,13}\s*$/,'').trim()});
  });

  /* ---- 기업성장등급 · 연계기업 ---- */
  P.growthGrade = (flat.match(/기업성장등급\s*([A-Z]{1,3}\s?\d?등급|\S*등급)/)||[])[1];
  P.linkedCorp  = (flat.match(/연계기업\s*(\d+)\s*건/)||[])[1];
  const firstLabeled = labels=>{
    const re=new RegExp('^(?:'+labels.join('|')+')\\s*[:：]?\\s*(.+)$');
    const line=L.find(item=>re.test(item));
    return line ? line.match(re)[1].trim() : null;
  };
  P.name      = P.name || firstLabeled(['회사명','상호','기업명']);
  P.ceo       = P.ceo || firstLabeled(['대표자명','대표자','대표이사']);
  P.bizNo     = P.bizNo || ((firstLabeled(['사업자번호','사업자등록번호'])||'').match(/\d{3}-?\d{2}-?\d{5}/)||[])[0];
  P.foundDate = P.foundDate || ((firstLabeled(['설립일','설립년월일','설립년월'])||'').match(/\d{4}[-./]\d{1,2}[-./]\d{1,2}/)||[])[0];
  P.employees = P.employees===null||P.employees===undefined
    ? toNum(firstLabeled(['종업원수','종업원 수','상시근로자수','상시근로자'])) : P.employees;
  P.industry  = P.industry || firstLabeled(['업종','주업종','표준산업분류']);
  P.product   = P.product || firstLabeled(['주요제품','주요 제품','생산품']);
  P.addr      = P.addr || firstLabeled(['주소','소재지','사업장주소']);
  P.grade     = P.grade || firstLabeled(['신용등급','기업신용등급']);
  P.mainBank  = P.mainBank || firstLabeled(['주채권기관','거래은행','주거래은행']);
  if(P.name) mark('기업개요');
  P.rawText = T;
  P.rawLines = L.filter(Boolean);

  return P;
}
/* ============================================================
   PART D. 추출 데이터 → 브리핑 문서 데이터(DOC) 생성
   ============================================================ */
function buildDoc(P){
  P = P || {};
  const F = P.fin || {}, R = P.ratio || {}, A = P.indAvg || {};
  const Y = (P.years && P.years.length===3) ? P.years : ['2023','2024','2025'];
  const a3 = a => (a && a.length===3) ? a : [null,null,null];
  const rev=a3(F.revenue), cogs=a3(F.cogs), gross=a3(F.gross), sga=a3(F.sga), op=a3(F.op),
        noi=a3(F.nonOpInc), noe=a3(F.nonOpExp), pre=a3(F.pretax), net=a3(F.net),
        ast=a3(F.assets), ca=a3(F.curAssets), nca=a3(F.nonCurAssets), lia=a3(F.liab),
        cl=a3(F.curLiab), ncl=a3(F.nonCurLiab), eq=a3(F.equity), cap=a3(F.capital),
        ret=a3(F.retained), dep=a3(F.deprec), intr=a3(F.interest);
  const rr=a3(R.revGrowth), ro=a3(R.opGrowth), rom=a3(R.opMargin), reb=a3(R.ebitda),
        roe=a3(R.roe), rnm=a3(R.netMargin), rdr=a3(R.debtRatio), rbd=a3(R.borrowDep),
        ric=a3(R.interestCov), rcr=a3(R.currentRatio), rat=a3(R.arTurn), rct=a3(R.capTurn);
  const nm  = P.name || '(주)○○○';
  const emp = P.employees;
  const now = new Date();
  const ym  = now.getFullYear()+'. '+String(now.getMonth()+1).padStart(2,'0');
  const age = P.foundDate ? yearsBetween(P.foundDate) : null;
  const ebitda = (op[2]!==null && dep[2]!==null) ? op[2]+dep[2] : null;
  const ebitdaM = reb[2]!==null ? reb[2] : (ebitda!==null&&rev[2] ? ebitda/rev[2]*100 : null);
  const eqRatio = (eq[2]!==null&&ast[2]) ? eq[2]/ast[2]*100 : null;
  const curRatio = rcr[2]!==null ? rcr[2] : ((ca[2]!==null&&cl[2])? ca[2]/cl[2]*100 : null);
  const M = v => v===null||v===undefined ? D_ : fmt(v)+'백만원';
  const PC = (v,d) => v===null||v===undefined ? D_ : fmt(v, d===undefined?2:d)+'%';
  const cell = v => v===null||v===undefined||v==='' ? D_ : String(v);
  const sourceLines = P.rawLines || [];
  const evidence = (terms, limit)=>sourceLines.filter(line=>terms.some(term=>line.includes(term)))
    .filter((line,i,all)=>all.indexOf(line)===i).slice(0,limit||3).join(' · ');

  /* ---------- 표 데이터 ---------- */
  const T = {};

  T.profile = [
    ['구분','내용','구분','내용'],
    ['기업명', nm + (P.nameEn? ' ('+P.nameEn+')':''), '대표자', cell(P.ceo)],
    ['사업자번호', cell(P.bizNo), '법인번호', cell(P.corpNo)],
    ['설립일', cell(P.foundDate) + (age? ' (업력 '+fmt(age,1)+'년)':''), '결산월', cell(P.settleMonth)],
    ['업종', cell(P.industry), '주요제품', cell(P.product)],
    ['소재지', cell(P.addr), '종업원수', emp!==null&&emp!==undefined? fmt(emp)+'명' : D_],
    ['자본금', cap[2]!==null? fmt(cap[2]*1000000)+'원' : D_, '기업규모', [P.scale,P.corpType].filter(Boolean).join(' · ')||D_]
  ];

  T.share = [['주주명','지분율','비고']];
  (P.shareholders||[]).slice(0,6).forEach(s=>{
    T.share.push([s.name, fmt(s.ratio,2)+'%', [s.rel,s.co||s.kind].filter(Boolean).join(' · ')||'-']);
  });
  if(T.share.length===1) T.share.push([D_,D_,'자료 확보 후 기재']);

  T.exec = [['성명','직위','등기여부','비고']];
  (P.execs||[]).slice(0,6).forEach(e=>{
    T.exec.push([e.name, e.title, e.reg||'-', [e.note, e.rel? '경영실권자 '+e.rel:''].filter(Boolean).join(' · ')||'-']);
  });
  if(T.exec.length===1) T.exec.push([D_,D_,D_,'자료 확보 후 기재']);

  T.buy = [['구매처','거래비중']];
  (P.buyers||[]).slice(0,5).forEach(b=> T.buy.push([b.name, fmt(b.share,2)+'%']));
  if(T.buy.length===1) T.buy.push([D_,D_]);
  T.sell = [['판매처','거래비중']];
  (P.sellers||[]).slice(0,5).forEach(b=> T.sell.push([b.name, fmt(b.share,2)+'%']));
  if(T.sell.length===1) T.sell.push([D_,D_]);

  const rowPL = (label, arr) => [label, fmt(arr[0]), fmt(arr[1]), fmt(arr[2]),
    pctStr(arr[1],arr[0]), pctStr(arr[2],arr[1])];
  T.pl = [['계정과목',Y[0],Y[1],Y[2],'증감('+Y[1].slice(2)+'/'+Y[0].slice(2)+')','증감('+Y[2].slice(2)+'/'+Y[1].slice(2)+')'],
    rowPL('매출액',rev), rowPL('매출원가',cogs), rowPL('매출총이익',gross),
    rowPL('판매비와관리비',sga), rowPL('영업이익',op), rowPL('영업외수익',noi),
    rowPL('영업외비용',noe), rowPL('법인세차감전순이익',pre), rowPL('당기순이익',net)];

  T.bs = [['계정과목',Y[0],Y[1],Y[2],'증감('+Y[1].slice(2)+'/'+Y[0].slice(2)+')','증감('+Y[2].slice(2)+'/'+Y[1].slice(2)+')'],
    rowPL('자산총계',ast), rowPL('ㄴ 유동자산',ca), rowPL('ㄴ 비유동자산',nca),
    rowPL('부채총계',lia), rowPL('ㄴ 유동부채',cl), rowPL('ㄴ 비유동부채(차입금)',ncl),
    rowPL('자본총계',eq), rowPL('ㄴ 자본금',cap), rowPL('ㄴ 이익잉여금',ret)];

  const rw=(g,l,arr,av,unit)=>[g,l,
    arr[0]===null?D_:fmt(arr[0],2)+(unit||'%'), arr[1]===null?D_:fmt(arr[1],2)+(unit||'%'),
    arr[2]===null?D_:fmt(arr[2],2)+(unit||'%'), av===null||av===undefined?'-':fmt(av,1)+(unit||'%')];
  T.ratio = [['구분','지표',Y[0],Y[1],Y[2],'업종평균('+Y[2].slice(2)+')'],
    rw('성장성','매출액증가율',rr,A.revGrowth), rw('','영업이익증가율',ro,A.opGrowth),
    rw('수익성','영업이익률',rom,A.opMargin), rw('','EBITDA마진율',reb,A.ebitda),
    rw('','ROE',roe,null), rw('안정성','부채비율',rdr,A.debtRatio),
    rw('','차입금의존도',rbd,A.borrowDep), rw('','이자보상배수(배)',ric,A.interestCov,'배'),
    rw('','유동비율',rcr,A.currentRatio), rw('활동성','매출채권회전율(회)',rat,A.arTurn,'회'),
    rw('','총자본회전율(회)',rct,A.capTurn,'회')];

  /* ---------- KPI ---------- */
  const K = {};

function TOTAL(){ return DECK.length; }
function secRange(code){
  const idx=[]; DECK.forEach((d,i)=>{ if(d.sec===code) idx.push(i+1); });
  if(!idx.length) return '-';
  return idx.length===1? String(idx[0]) : (idx[0]+'~'+idx[idx.length-1]);
}
function tocRows(){
  return Object.keys(SECT).map(code=>({
    no:code, title:SECT[code].title, desc:SECT[code].desc, pages:secRange(code)
  }));
}
function buildSlides(D){
  return DECK.map((d,i)=>{
    const s=d.b(D,i+1);
    s.nav=d.nav; s.title=d.title; s.sec=d.sec; s.page=i+1;
    return s;
  });
}
/* 목차 네비게이션 구조 */
function navTree(){
  const out=[]; const seen={};
  DECK.forEach((d,i)=>{
    if(!d.sec){ out.push({type:'single', no:i+1, label:d.nav}); return; }
    if(!seen[d.sec]){
      seen[d.sec]={type:'sec', no:d.sec, label:SECT[d.sec].title, items:[]};
      out.push(seen[d.sec]);
    }
    seen[d.sec].items.push([i+1, d.nav]);
  });
  return out;
}

/* ============================================================
   PART F. 미리보기 렌더링 (HTML) · 목차 네비게이션
   ============================================================ */
const PX=96;
const pt=v=>(v*96/72);
let DOC=null, SPEC=null, OBS=null;

function styleOf(el){
  return 'left:'+(el.x*PX)+'px;top:'+(el.y*PX)+'px;width:'+(el.w*PX)+'px;height:'+(el.h*PX)+'px;';
}
function elHTML(el){
  if(el.k==='rect'){
    const b=el.line? ('border:'+(el.line.w||1)+'px solid #'+el.line.c+';') : '';
    const r=el.r? ('border-radius:'+(el.r===99?'50%':el.r+'px')+';') : '';
    return '<div class="el" style="'+styleOf(el)+'background:#'+el.fill+';'+b+r+'"></div>';
  }
  if(el.k==='text'){
    const va=el.va==='m'?'center':(el.va==='b'?'flex-end':'flex-start');
    const al=el.al==='c'?'center':(el.al==='r'?'right':'left');
    const cls='el'+(el.p?' editable':'');
    const ed=el.p? ' contenteditable="plaintext-only" data-path="'+el.p+'" spellcheck="false"':'';
    return '<div class="'+cls+'" style="'+styleOf(el)
      +'display:flex;align-items:'+va+';justify-content:'+(al==='center'?'center':(al==='right'?'flex-end':'flex-start'))+';'
      +'font-size:'+pt(el.sz)+'px;line-height:1.35;color:#'+(el.col||CL.text)+';'
      +'font-weight:'+(el.b?700:400)+';text-align:'+al+';"'+ed+'>'+esc(el.s)+'</div>';
  }
  if(el.k==='table') return tableHTML(el);
  if(el.k==='chart') return '<div class="el" style="'+styleOf(el)+'">'+chartSVG(el)+'</div>';
  return '';
}
function tableHTML(el){
  const tot=el.colW.reduce((a,b)=>a+b,0);
  const rows=el.rows;
  const rowH=el.rowH || (el.h? el.h/rows.length : 0.3);
  let h='<div class="el" style="'+styleOf({x:el.x,y:el.y,w:el.w,h:rowH*rows.length})+'">';
  h+='<table class="gt" style="height:100%"><colgroup>'
    + el.colW.map(w=>'<col style="width:'+(w/tot*100)+'%">').join('') + '</colgroup><tbody>';
  rows.forEach((r,ri)=>{
    h+='<tr style="height:'+(rowH*PX)+'px">';
    r.forEach((c,ci)=>{
      const head = ri===0;
      const bg = head? CL.navy : (ri%2===1? 'FFFFFF' : CL.panel2);
      const col= head? 'FFFFFF' : CL.text;
      const al = head? 'center' : ((el.align&&el.align[ci])==='r'?'right':((el.align&&el.align[ci])==='c'?'center':'left'));
      const p  = el.path+'.'+ri+'.'+ci;
      h+='<td class="ed" style="background:#'+bg+';color:#'+col+';font-weight:'+(head?700:400)
        +';font-size:'+pt(el.sz)+'px;text-align:'+al+';line-height:1.3">'
        +'<div contenteditable="plaintext-only" data-path="'+p+'" spellcheck="false">'+esc(c)+'</div></td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------- 차트 (SVG) ---------- */
function chartSVG(el){
  const W=el.w*PX, H=el.h*PX;
  const cats=el.cats, ser=el.series;
  const pad={l:4,r:4,t:14,b:16};
  if(el.type==='bar'){
    const maxv=Math.max.apply(null,ser[0].vals.concat([1]));
    const rowH=(H-pad.t-4)/cats.length;
    let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
    cats.forEach((c,i)=>{
      const y=pad.t+rowH*i+2, bh=Math.max(rowH-8,6);
      const bw=(W-90)*(ser[0].vals[i]/maxv);
      s+='<text x="0" y="'+(y+bh/2+3)+'" font-size="9" fill="#'+CL.gray+'">'+esc(c)+'</text>';
      s+='<rect x="40" y="'+y+'" width="'+Math.max(bw,1)+'" height="'+bh+'" fill="#'+ser[0].color+'" rx="2"/>';
      s+='<text x="'+(46+bw)+'" y="'+(y+bh/2+3)+'" font-size="9" fill="#'+CL.navy+'" font-weight="700">'+ser[0].vals[i]+'</text>';
    });
    return s+'</svg>';
  }
  if(el.type==='line'){
    const all=[].concat.apply([],ser.map(s=>s.vals));
    const mx=Math.max.apply(null,all.concat([1])), mn=Math.min(0,Math.min.apply(null,all));
    const gw=W-pad.l-pad.r-24, gh=H-pad.t-pad.b-14;
    const X=i=>pad.l+20+gw*(cats.length===1?0.5:i/(cats.length-1));
    const Yv=v=>pad.t+gh-(gh*((v-mn)/((mx-mn)||1)));
    let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
    s+='<line x1="'+(pad.l+16)+'" y1="'+(pad.t+gh)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+gh)+'" stroke="#'+CL.border+'"/>';
    ser.forEach(se=>{
      const d=se.vals.map((v,i)=>(i?'L':'M')+X(i)+' '+Yv(v)).join(' ');
      s+='<path d="'+d+'" fill="none" stroke="#'+se.color+'" stroke-width="2"/>';
      se.vals.forEach((v,i)=>{ s+='<circle cx="'+X(i)+'" cy="'+Yv(v)+'" r="3" fill="#'+se.color+'"/>'; });
    });
    cats.forEach((c,i)=>{ s+='<text x="'+X(i)+'" y="'+(pad.t+gh+12)+'" font-size="9" fill="#'+CL.gray+'" text-anchor="middle">'+esc(c)+'</text>'; });
    let lx=pad.l+18;
    ser.forEach(se=>{ s+='<rect x="'+lx+'" y="'+(H-11)+'" width="8" height="8" fill="#'+se.color+'"/>'
      +'<text x="'+(lx+11)+'" y="'+(H-4)+'" font-size="8.5" fill="#'+CL.gray+'">'+esc(se.name)+'</text>';
      lx+=se.name.length*8+26; });
    return s+'</svg>';
  }
  const stacked = el.type==='colStacked';
  const totals = cats.map((c,i)=> stacked? ser.reduce((a,s)=>a+(s.vals[i]||0),0) : Math.max.apply(null,ser.map(s=>s.vals[i]||0)));
  const mx=Math.max.apply(null,totals.concat([1]));
  const gw=W-pad.l-pad.r, gh=H-pad.t-pad.b;
  const slot=gw/cats.length;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+pad.l+'" y1="'+(pad.t+gh)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+gh)+'" stroke="#'+CL.border+'"/>';
  cats.forEach((c,i)=>{
    const cx=pad.l+slot*i;
    if(stacked){
      const bw=Math.min(slot*0.5,34); let acc=0;
      ser.forEach(se=>{
        const v=se.vals[i]||0, bh=gh*(v/mx);
        acc+=bh;
        s+='<rect x="'+(cx+(slot-bw)/2)+'" y="'+(pad.t+gh-acc)+'" width="'+bw+'" height="'+Math.max(bh,0)+'" fill="#'+se.color+'"/>';
      });
      s+='<text x="'+(cx+slot/2)+'" y="'+(pad.t+gh-acc-3)+'" font-size="8.5" fill="#'+CL.navy+'" text-anchor="middle" font-weight="700">'+fmt(totals[i])+'</text>';
    }else{
      const bw=Math.min((slot*0.62)/ser.length,26);
      ser.forEach((se,j)=>{
        const v=se.vals[i]||0, bh=gh*(v/mx);
        const x=cx+slot/2-(bw*ser.length)/2+bw*j;
        s+='<rect x="'+x+'" y="'+(pad.t+gh-bh)+'" width="'+(bw-3)+'" height="'+Math.max(bh,0)+'" fill="#'+se.color+'" rx="1"/>';
        s+='<text x="'+(x+(bw-3)/2)+'" y="'+(pad.t+gh-bh-3)+'" font-size="8" fill="#'+CL.navy+'" text-anchor="middle" font-weight="700">'+fmt(v)+'</text>';
      });
    }
    s+='<text x="'+(cx+slot/2)+'" y="'+(pad.t+gh+12)+'" font-size="9" fill="#'+CL.gray+'" text-anchor="middle">'+esc(c)+'</text>';
  });
  if(ser.length>1){
    let lx=pad.l+2;
    ser.forEach(se=>{ s+='<rect x="'+lx+'" y="2" width="8" height="8" fill="#'+se.color+'"/>'
      +'<text x="'+(lx+11)+'" y="9.5" font-size="8.5" fill="#'+CL.gray+'">'+esc(se.name)+'</text>';
      lx+=se.name.length*9+26; });
  }
  return s+'</svg>';
}

function renderAll(){

function fitSlides(){
  const box=document.querySelector('.slide-box');

  const w=Math.min($('#main').clientWidth-52, 1280);
  const sc=w/1280;
  document.querySelectorAll('.slide-box').forEach(b=>{
    b.style.width=w+'px'; b.style.height=(720*sc)+'px';
    b.querySelector('.slide').style.transform='scale('+sc+')';
  });
}

function goScroll(top){
  const m=$('#main');
  try{ m.scrollTo({top:top, behavior:'smooth'}); }catch(e){ m.scrollTop=top; }
  setTimeout(()=>{ if(Math.abs(m.scrollTop-top)>4) m.scrollTop=top; }, 400);
  setTimeout(()=>{ if(Math.abs(m.scrollTop-top)>4) m.scrollTop=top; }, 900);
}

/* ---------- 목차 네비게이션 ---------- */
function buildNav(){
  let h='<h3>NAVIGATION</h3>';
  navTree().forEach(n=>{
    if(n.type==='single'){
      h+='<div class="nav-item" data-go="'+n.no+'"><span class="no">'+(n.no===1?'▣':'▤')+'</span><span>'+esc(n.label)+'</span></div>';
    }else{
      h+='<div class="side-sep"></div>';
      h+='<div class="nav-item" data-go="'+n.items[0][0]+'"><span class="no">'+n.no+'</span><span>'+esc(n.label)+'</span></div>';
      n.items.forEach(it=>{
        h+='<div class="nav-sub" data-go="'+it[0]+'">'+esc(it[1])+'<span class="pg">p.'+it[0]+'</span></div>';
      });
    }
  });
  h+='<div class="side-sep"></div>';
  h+='<div class="nav-item" data-go="1"><span class="no">↑</span><span>맨 위로</span></div>';
  $('#side').innerHTML=h;
  $('#side').querySelectorAll('[data-go]').forEach(e=>{
    e.addEventListener('click',()=>{
      const no=+e.getAttribute('data-go');
      goSlide(no);
    });
  });
}
function observeSlides(){
  if(OBS) OBS.disconnect();
  OBS=new IntersectionObserver(ents=>{
    ents.forEach(en=>{
      if(en.isIntersecting){
        const no=en.target.getAttribute('data-no');
        document.querySelectorAll('#side [data-go]').forEach(e=>{
          e.classList.toggle('active', e.getAttribute('data-go')===no);
        });
      }
    });
  },{root:$('#main'),threshold:.45});
  document.querySelectorAll('.slide-wrap').forEach(s=>OBS.observe(s));
}

   ============================================================ */
const FONT='맑은 고딕';
function addElPptx(pptx, sl, el){
  if(el.k==='rect'){
    const st = el.r===99 ? pptx.ShapeType.ellipse : (el.r ? pptx.ShapeType.roundRect : pptx.ShapeType.rect);
    sl.addShape(st, {x:el.x, y:el.y, w:el.w, h:el.h,
      fill:{color:el.fill},
      line: el.line ? {color:el.line.c, width:el.line.w||1} : {color:el.fill, width:0},
      rectRadius: el.r&&el.r!==99 ? 0.06 : undefined});
    return;
  }
  if(el.k==='text'){
    sl.addText(String(el.s===null||el.s===undefined?'':el.s), {
      x:el.x, y:el.y, w:el.w, h:el.h, fontSize:el.sz, bold:!!el.b,
      color: el.col||CL.text, fontFace:FONT,
      align: el.al==='c'?'center':(el.al==='r'?'right':'left'),
      valign: el.va==='m'?'middle':(el.va==='b'?'bottom':'top'),
      lineSpacingMultiple:1.2, margin:0, wrap:true, isTextBox:true});
    return;
  }
  if(el.k==='table'){
    const rows=el.rows.map((r,ri)=> r.map((c,ci)=>({
      text:String(c===null||c===undefined?'':c),
      options:{
        fill:{color: ri===0?CL.navy:(ri%2===1?'FFFFFF':CL.panel2)},
        color: ri===0?'FFFFFF':CL.text,
        bold: ri===0,
        align: ri===0?'center':((el.align&&el.align[ci])==='r'?'right':((el.align&&el.align[ci])==='c'?'center':'left')),
        valign:'middle', fontSize:el.sz, fontFace:FONT
      }
    })));
    sl.addTable(rows, {x:el.x, y:el.y, w:el.w, colW:el.colW, rowH:el.rowH,
      border:{type:'solid', color:CL.border, pt:0.75}, margin:[2,4,2,4], autoPage:false, fontFace:FONT});
    return;
  }
  if(el.k==='chart'){
    const data=el.series.map(s=>({name:s.name, labels:el.cats, values:s.vals}));
    const opts={x:el.x, y:el.y, w:el.w, h:el.h,
      chartColors: el.series.map(s=>s.color),
      showLegend: el.series.length>1, legendPos:'b', legendFontSize:8,
      showValue:true, dataLabelFontSize:7, dataLabelColor:CL.navy, dataLabelFontFace:FONT,
      catAxisLabelFontSize:8, catAxisLabelFontFace:FONT, catAxisLabelColor:CL.gray,
      valAxisHidden:true, valGridLine:{style:'none'}, catAxisLineShow:true,
      border:{pt:0,color:'FFFFFF'}, dataBorder:{pt:0,color:'FFFFFF'}, plotArea:{fill:{color:'FFFFFF'}}};
    let type=pptx.ChartType.bar;
    if(el.type==='col'){ opts.barDir='col'; opts.barGapWidthPct=60; }
    else if(el.type==='colStacked'){ opts.barDir='col'; opts.barGrouping='stacked'; opts.barGapWidthPct=60; }
    else if(el.type==='bar'){ opts.barDir='bar'; opts.barGapWidthPct=40; }
    else if(el.type==='line'){ type=pptx.ChartType.line; opts.lineDataSymbolSize=6; opts.lineSize=2; opts.showValue=false; }
    sl.addChart(type, data, opts);
    return;
  }
}
async function exportPptx(){
  if(!DOC) return;
  busy(true,'PowerPoint 파일 생성 중…');
  try{
    const pptx=new PptxGenJS();
    pptx.defineLayout({name:'W16x9', width:13.333, height:7.5});

      const sl=pptx.addSlide();
      sl.background={color:'FFFFFF'};
      s.els.forEach(el=>{ try{ addElPptx(pptx,sl,el); }catch(err){ console.warn('el skip',el,err); } });
    });
    const nm=(DOC.meta.company||'기업').replace(/[\\/:*?"<>|]/g,'')+'_기업컨설팅_브리핑.pptx';
    await pptx.writeFile({fileName:nm});
    toast('PPTX 파일을 저장했습니다 : '+nm, 4000);
  }catch(err){
    console.error(err); toast('PPTX 생성 실패 : '+err.message, 5000);
  }finally{ busy(false); }
}

   PART H. 업로드 처리 · 초기화
   ============================================================ */
async function handleFiles(fileList){
  const files=[...fileList];
  if(!files.length) return;
  busy(true,'파일을 읽고 있습니다…');
  logClear();
  const chips=[]; const successful=[]; const failed=[]; let all='';
  for(const f of files){
    try{
      busy(true,f.name+' 분석 중…');
      const t=await fileToText(f);
      if(!t.trim()) throw new Error('추출된 텍스트가 없습니다');
      all += '\n'+t;
      successful.push(f);
      chips.push('<span class="chip">'+esc(f.name)+' · '+fmt(Math.round(t.length/1000))+'K자</span>');
    }catch(err){
      console.error(err);
      failed.push(f.name);
      chips.push('<span class="chip err">'+esc(f.name)+' · 읽기 실패</span>');
    }
  }
  $('#chips').innerHTML=chips.join('');
  if(!all.trim()){
    busy(false);
    logLine('<span class="warn">업로드 파일에서 텍스트를 추출하지 못했습니다.</span> 이미지 PDF인지, 파일 형식이 올바른지 확인하세요.');
    toast('읽을 수 있는 텍스트가 없습니다.',4000);
    return;
  }
  RAW_TEXT=all;
  const P=extractData(all);
  P.fileNames=successful.map(f=>f.name);
  DOC=buildDoc(P);
  renderAll();
  reportExtraction(P, successful, failed);
  busy(false);
  toast('업로드 내용이 브리핑 양식에 작성되었습니다.');
  setTimeout(()=>goSlide(3), 350);
}
let RAW_TEXT='';

function reportExtraction(P, files, failed){
  const F=P.fin||{};
  const rows=[
    ['기업명',P.name],['대표자',P.ceo],['사업자번호',P.bizNo],['설립일',P.foundDate],
    ['종업원수',P.employees!=null? P.employees+'명':null],['업종',P.industry],
    ['신용등급',P.grade],['최근 매출액',F.revenue&&F.revenue[2]!=null? fmt(F.revenue[2])+'백만원':null],
    ['최근 영업이익',F.op&&F.op[2]!=null? fmt(F.op[2])+'백만원':null],
    ['주주',P.shareholders&&P.shareholders.length? P.shareholders.length+'명':null],
    ['경영진',P.execs&&P.execs.length? P.execs.length+'명':null],
    ['거래처',(P.buyers||[]).length+(P.sellers||[]).length? ((P.buyers||[]).length+'/'+(P.sellers||[]).length+'건'):null],
    ['연혁',(P.history||[]).length? P.history.length+'건':null],
    ['사업목적',(P.purpose||[]).length? P.purpose.length+'개':null],
    ['대표자 종사기간',P.ceoTenure],
    ['업계순위',P.rank&&P.rank.rank? P.rank.rank:null],
    ['업종평균 비교',P.peer? '경영규모 4개 구간':null],
    ['현금흐름',F.cashOp&&F.cashOp[2]!=null? fmt(F.cashOp[2])+'백만원(현금영업이익)':null],
    ['제조원가 구성',F.material&&F.material[2]!=null? '원재료·노무·경비 3개년':null],
    ['특수관계자 대여금',F.ltLoan&&F.ltLoan[0]!=null? fmt(F.ltLoan[0],1)+'→'+fmt(F.ltLoan[2],1)+'백만원':null],
    ['이익잉여금',F.unappropriated&&F.unappropriated[2]!=null? fmt(F.unappropriated[2])+'백만원':null],
    ['연구개발비(경상개발비)',F.rnd&&F.rnd[2]!=null? fmt(F.rnd[2],2)+'백만원':null]
  ];
  const ok=rows.filter(r=>r[1]).map(r=>'<b>'+r[0]+'</b> '+esc(r[1])).join('  ·  ');
  const miss=rows.filter(r=>!r[1]).map(r=>r[0]);
  logLine('<b>업로드 파일 '+files.length+'건 분석 완료</b>'
    +(failed&&failed.length?' · 읽기 실패 '+failed.length+'건':'')+' — 인식 영역 : '
    + (P.found.length? '<span class="ok">'+P.found.join(' · ')+'</span>' : '<span class="warn">인식된 표준 항목 없음</span>'));
  if(ok) logLine('추출값 : '+ok);
  if(miss.length) logLine('<span class="warn">미인식 항목</span> : '+miss.join(' · ')+' — 해당 칸을 직접 클릭해 입력하세요.');
  logLine('모든 텍스트·표 항목은 클릭해서 수정할 수 있으며, 수정 내용은 PPTX 다운로드에 그대로 반영됩니다.');
}

/* ---------- 저장 / 불러오기 ---------- */
function saveJson(){
  const blob=new Blob([JSON.stringify(DOC,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(DOC.meta.company||'기업').replace(/[\\/:*?"<>|]/g,'')+'_브리핑작업.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('작업 내용을 JSON으로 저장했습니다.');
}
async function loadJson(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||!d.meta||!d.t) throw new Error('형식이 올바르지 않습니다');
    DOC=d; renderAll(); toast('저장된 작업을 불러왔습니다.');
  }catch(err){ toast('불러오기 실패 : '+err.message,4000); }
}

/* ---------- 이벤트 ---------- */
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
drop.addEventListener('click',e=>{ if(e.target.id!=='btnPick') $('#fileInput').click(); });
$('#btnPick').addEventListener('click',()=>$('#fileInput').click());
$('#btnUpload').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',e=>{ handleFiles(e.target.files); e.target.value=''; });
$('#btnPptx').addEventListener('click',exportPptx);
$('#btnSave').addEventListener('click',saveJson);
$('#btnLoad').addEventListener('click',()=>$('#jsonInput').click());
$('#jsonInput').addEventListener('change',e=>{ if(e.target.files[0]) loadJson(e.target.files[0]); e.target.value=''; });
$('#btnReset').addEventListener('click',()=>{
  if(!confirm('작성된 내용을 모두 지우고 빈 양식으로 되돌립니다. 계속할까요?')) return;
  DOC=buildDoc({}); RAW_TEXT=''; $('#chips').innerHTML=''; logClear(); renderAll();
  goScroll(0);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveJson(); }
});

/* ---------- 시작 ---------- */
DOC=buildDoc({});
renderAll();
</script>
</body>
